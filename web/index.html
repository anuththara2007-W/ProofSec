<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProofSec</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="glass">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            <h1>ProofSec</h1>
        </div>
        <div class="status-indicator" id="api-status">
            <span class="dot checking"></span> Checking API...
        </div>
    </header>

    <main>
        <div class="layout">
            <aside class="sidebar glass">
                <nav>
                    <button class="nav-btn active" data-target="evaluate-view">Evaluate</button>
                    <button class="nav-btn" data-target="history-view">History</button>
                </nav>
            </aside>

            <section class="content" id="evaluate-view">
                <div class="card glass">
                    <h2>New Evaluation</h2>
                    <form id="eval-form">
                        <div class="form-group">
                            <label for="scenario">Scenario Description</label>
                            <textarea id="scenario" rows="4" placeholder="Describe the security scenario or context..."></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Evidence</label>
                            <div id="evidence-list">
                                <div class="evidence-input-wrapper">
                                    <input type="text" class="evidence-input" placeholder="E.g., HTTP 200 OK returned with user data">
                                </div>
                            </div>
                            <button type="button" class="btn btn-secondary btn-sm" id="add-evidence-btn">+ Add Evidence</button>
                        </div>

                        <div class="form-group">
                            <label for="provider">Provider</label>
                            <select id="provider">
                                <option value="kaggle">Kaggle</option>
                                <option value="openai_compatible">OpenAI Compatible</option>
                                <option value="mock">Mock (Test Fixture)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary" id="evaluate-submit-btn">Evaluate Scenario</button>
                    </form>
                </div>

                <div id="result-container" class="hidden">
                    <!-- Results populated by JS -->
                </div>
            </section>

            <section class="content hidden" id="history-view">
                <div class="card glass">
                    <h2>Evaluation History</h2>
                    <div class="table-container">
                        <table id="history-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Classification</th>
                                    <th>State</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="history-body">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
